name: Sync company logos from HubSpot

on:
  schedule:
    - cron: "17 2 * * *"   # every night at 02:17 UTC
  workflow_dispatch:        # "Run workflow" button for a manual run

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests==2.32.3 pillow==10.4.0

      - name: Download logos from HubSpot
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          CHANGED_FILE: changed.txt
        run: python scripts/sync_logos.py

      - name: Commit changes
        run: |
          git config user.name "logo-sync-bot"
          git config user.email "logo-sync-bot@users.noreply.github.com"
          git add logos
          if git diff --cached --quiet; then
            echo "No logo changes"
          else
            git commit -m "Sync logos from HubSpot"
            git push
          fi

      - name: Refresh jsDelivr cache for changed logos
        run: |
          if [ -s changed.txt ]; then
            head -n 200 changed.txt | while read f; do
              curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$f" > /dev/null || true
            done
          fi
